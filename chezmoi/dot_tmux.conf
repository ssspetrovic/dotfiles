set -g mouse on
set -g history-limit 100000
set -g status-interval 1
set -g base-index 1
setw -g pane-base-index 1

# Newer tmux versions can pass CSI u / extended keys through to editors.
# Keep these version-gated so older distro tmux builds still parse this config.
if-shell 'tmux -V | awk "{ split(\$2, v, \".\"); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 2)) }"' 'set -g extended-keys on'
if-shell 'tmux -V | awk "{ split(\$2, v, \".\"); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 5)) }"' 'set -g extended-keys-format csi-u'

# Vim-like copy mode keys. This only affects tmux copy mode, not normal terminal selection.
setw -g mode-keys vi

# Allow tmux to send copied text to the system clipboard via OSC 52.
# This is what helps remote tmux copy reach your local clipboard, if your terminal permits it.
set -g set-clipboard on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Copy-mode bindings.
# Enter copy mode with C-a [
# Start selection with v, copy with y.
# Prefer local clipboard tools where available; tmux still keeps the selection in
# its own buffer and set-clipboard can use OSC 52 when the terminal supports it.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; fi'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; fi'

set -g status-bg colour234
set -g status-fg colour137
set -g status-left-length 30
set -g status-right-length 150

set -g status-left '#[fg=colour39]#S #[fg=colour245]|'
set -g status-right '#[fg=colour245]%Y-%m-%d #[fg=colour39]%H:%M:%S '

set-window-option -g window-status-current-format '#[fg=colour39] #I:#W#F '

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

run '~/.tmux/plugins/tpm/tpm'
